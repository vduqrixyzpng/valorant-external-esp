[project]
name = "valorant-external-esp"
version = "0.4.2"
description = "Educational external ESP / aimbot research toolkit for Valorant"
requires-python = ">=3.11"
authors = [{ name = "esp-research-collective" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"